[package]
name = "reelif-capture"
version = "0.1.4"
description = "Capturely by SyntaxilitY - a screen recorder with smooth click zooms"
authors = ["SyntaxilitY"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "reelif_capture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
# Start, stop, pause and marker keys from any app. MIT/Apache-2.0.
tauri-plugin-global-shortcut = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "rt-multi-thread", "time"] }
tokio-util = "0.7"
thiserror = "2"
fs4 = { version = "0.13", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_JobObjects", "Win32_Security"] }
# System sound (WASAPI loopback). Apache-2.0.
cpal = "0.15"
# Windows' built-in text recognition (blurring remembered words) and screen copies for it. Same
# version as Tauri's. MIT/Apache-2.0.
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Window list and pointer through Xlib, loaded at run time (as Tauri's windowing does). MIT.
x11-dl = "2.21"
# Turn on getUserMedia in the webview (same version as Tauri's).
webkit2gtk = "2.0"

[target.'cfg(target_os = "macos")'.dependencies]
# One Objective-C call (NSWindow sharingType); same version as Tauri's. MIT.
objc2 = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
