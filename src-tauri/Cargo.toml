[package]
name = "reelif-capture"
version = "0.1.0"
description = "ReeliF Capture by SyntaxilitY - a screen recorder with smooth click zooms"
authors = ["SyntaxilitY"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "reelif_capture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "rt-multi-thread", "time"] }
tokio-util = "0.7"
thiserror = "2"
fs4 = { version = "0.13", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
# System sound (WASAPI loopback). Apache-2.0.
cpal = "0.15"

[profile.release]
lto = true
codegen-units = 1
strip = true
